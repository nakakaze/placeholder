<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Site – Work in Progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0b14;
      --surface: #16121f;
      --accent1: #b48aff;
      --accent2: #ffb3de;
      --accent3: #7ee8fa;
      --text: #e8e0f5;
      --muted: #7a6e92;
      --border: rgba(180,138,255,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: drift var(--dur) ease-in-out infinite var(--delay);
    }
    @keyframes drift {
      0%   { opacity: 0; transform: translateY(100vh) scale(0.4); }
      20%  { opacity: 0.55; }
      80%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-12vh) scale(1.1); }
    }

    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      opacity: 0.25;
    }

    .container {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(180,138,255,0.08),
        0 32px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(180,138,255,0.07);
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(36px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar-wrap {
      position: relative;
      width: 128px; height: 128px;
      margin: 0 auto 1.8rem;
    }
    .avatar-ring {
      position: absolute; inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--accent1), var(--accent2), var(--accent3), var(--accent1));
      animation: spin 4s linear infinite;
      opacity: 0.75;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-ring-mask {
      position: absolute; inset: 3px;
      border-radius: 50%;
      background: var(--surface);
    }
    .avatar-img {
      position: relative; z-index: 1;
      width: 128px; height: 128px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(180,138,255,0.1);
      border: 1px solid rgba(180,138,255,0.28);
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--accent1);
      margin-bottom: 1.4rem;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, var(--accent1) 20%, var(--accent2) 60%, var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }
    .subtitle em {
      color: var(--accent2);
      font-style: normal;
    }

    .progress-wrap {
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      height: 6px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      animation: fill 2.5s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
      box-shadow: 0 0 12px rgba(180,138,255,0.5);
    }
    @keyframes fill { to { width: 75%; } }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.8rem 0;
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
    .footer-note span { color: var(--accent3); }

    /* ── lang switcher ── */
    .lang-switcher {
      position: fixed;
      top: 1.2rem;
      right: 1.4rem;
      z-index: 10;
      display: flex;
      gap: 0.4rem;
    }
    .lang-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn:hover {
      background: rgba(180,138,255,0.12);
      color: var(--accent1);
      border-color: rgba(180,138,255,0.4);
    }
    .lang-btn.active {
      background: rgba(180,138,255,0.15);
      color: var(--accent1);
      border-color: rgba(180,138,255,0.45);
    }

    /* text swap animation */
    .fade-out { animation: fadeOut 0.18s ease forwards; }
    .fade-in  { animation: fadeIn  0.28s ease forwards; }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-6px); } }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>

  <div class="bg-layer" id="particles"></div>
  <div class="grain"></div>

      <div class="badge">
        <span class="badge-dot"></span>
        <span id="badge-text">Work in Progress</span>
      </div>

      <h1 id="heading"></h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="progress-wrap">
        <div class="progress-bar"></div>
      </div>
      <div class="progress-label">
        <span id="progress-label">Fortschritt</span>
        <span>75%</span>
      </div>

      <hr class="divider"/>

      <p class="footer-note">
        made with <span>♡</span> — coming soon™
      </p>

    </div>
  </div>

  <script>
    const i18n = {
      de: {
        title:    'Hey, schön dass du da bist!',
        subtitle: 'Meine Seite ist gerade noch im Aufbau —\naber ich arbeite daran. 🌙\nSchau bald wieder vorbei, es lohnt sich <em>versprochen</em>.',
        progress: 'Fortschritt',
        badge:    'Work in Progress',
      },
      en: {
        title:    "Hey, glad you stopped by!",
        subtitle: "My site is still under construction —\nbut I'm working on it. 🌙\nCheck back soon, it'll be worth it <em>I promise</em>.",
        progress: 'Progress',
        badge:    'Work in Progress',
      }
    };

    let currentLang = 'de';

    function detectLang() {
      const lang = (navigator.language || navigator.userLanguage || 'de').toLowerCase();
      return lang.startsWith('de') ? 'de' : 'en';
    }

    function applyLang(lang, animate) {
      const t = i18n[lang];
      const heading  = document.getElementById('heading');
      const subtitle = document.getElementById('subtitle');
      const progress = document.getElementById('progress-label');
      const badge    = document.getElementById('badge-text');

      const targets = [heading, subtitle, progress, badge];

      if (animate) {
        targets.forEach(el => {
          el.classList.remove('fade-in');
          el.classList.add('fade-out');
        });
        setTimeout(() => {
          setContent(t, heading, subtitle, progress, badge);
          targets.forEach(el => {
            el.classList.remove('fade-out');
            el.classList.add('fade-in');
          });
        }, 190);
      } else {
        setContent(t, heading, subtitle, progress, badge);
      }

      document.getElementById('btn-de').classList.toggle('active', lang === 'de');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
      currentLang = lang;
    }

    function setContent(t, heading, subtitle, progress, badge) {
      heading.textContent  = t.title;
      subtitle.innerHTML   = t.subtitle.replace(/\n/g, '<br/>');
      progress.textContent = t.progress;
      badge.textContent    = t.badge;
    }

    function setLang(lang) {
      if (lang === currentLang) return;
      applyLang(lang, true);
    }

    // init
    const detected = detectLang();
    applyLang(detected, false);

    // particles
    const layer = document.getElementById('particles');
    const colors = ['#b48aff','#ffb3de','#7ee8fa','#c8b4ff'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 3;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        --dur:${Math.random()*10+8}s;
        --delay:${Math.random()*-14}s;
        filter:blur(${Math.random()*2}px);
      `;
      layer.appendChild(p);
    }
  </script>
